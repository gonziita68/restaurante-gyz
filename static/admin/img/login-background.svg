<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Fondo con gradiente -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a6c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b21f1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdbb2d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Patrón de puntos -->
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#ffffff" fill-opacity="0.3" />
    </pattern>
    
    <!-- Patrón de líneas onduladas -->
    <pattern id="waves" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M0,50 Q25,25 50,50 T100,50" stroke="#ffffff" stroke-width="1" fill="none" stroke-opacity="0.2" />
      <path d="M0,70 Q25,45 50,70 T100,70" stroke="#ffffff" stroke-width="1" fill="none" stroke-opacity="0.2" />
      <path d="M0,30 Q25,5 50,30 T100,30" stroke="#ffffff" stroke-width="1" fill="none" stroke-opacity="0.2" />
    </pattern>
  </defs>
  
  <!-- Fondo principal -->
  <rect width="1920" height="1080" fill="url(#grad1)" />
  
  <!-- Capa de puntos -->
  <rect width="1920" height="1080" fill="url(#dots)" />
  
  <!-- Capa de ondas -->
  <rect width="1920" height="1080" fill="url(#waves)" />
  
  <!-- Formas decorativas -->
  <circle cx="200" cy="200" r="300" fill="#ffffff" fill-opacity="0.05" />
  <circle cx="1720" cy="880" r="400" fill="#ffffff" fill-opacity="0.05" />
  
  <!-- Formas geométricas para restaurante -->
  <g transform="translate(960, 540)" opacity="0.15">
    <!-- Plato -->
    <circle cx="0" cy="0" r="150" stroke="#ffffff" stroke-width="4" fill="none" />
    
    <!-- Cubiertos -->
    <path d="M-80,-120 L-80,120 M-100,-100 L-100,0 M-60,-100 L-60,0 M-120,-100 L-120,0" 
          stroke="#ffffff" stroke-width="4" fill="none" />
    <path d="M80,-120 C120,-120 120,-80 120,0 L120,120 L80,120 L80,0 C80,-80 40,-100 40,-120 Z" 
          stroke="#ffffff" stroke-width="4" fill="none" />
    
    <!-- Copa -->
    <path d="M0,-120 L-30,-50 L-30,0 L30,0 L30,-50 Z" 
          stroke="#ffffff" stroke-width="4" fill="none" />
    <line x1="0" y1="0" x2="0" y2="50" stroke="#ffffff" stroke-width="4" />
    <ellipse cx="0" cy="50" rx="20" ry="5" stroke="#ffffff" stroke-width="4" fill="none" />
  </g>
</svg>